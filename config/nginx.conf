# ---- nginx.conf (Laptop 2 = edge reverse proxy + load balancer + TLS) ----
# Apple Silicon path: /opt/homebrew/etc/nginx/nginx.conf   Intel: /usr/local/etc/nginx/nginx.conf
# 192.168.1.12 = Laptop 3 (BOTH backends live there: port 3001 = A, port 3002 = B)
worker_processes 1;
events { worker_connections 1024; }

http {
    upstream backend {
        server 192.168.1.12:3001;   # Backend A
        server 192.168.1.12:3002;   # Backend B
        # round-robin is the default
    }

    server {
        listen 443 ssl;
        server_name app.teamX.test api.teamX.test;

        ssl_certificate     /opt/homebrew/etc/nginx/certs/server.crt;
        ssl_certificate_key /opt/homebrew/etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
